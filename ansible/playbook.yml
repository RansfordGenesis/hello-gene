---
- name: Configure and deploy FastAPI application
  hosts: web
  become: yes

  tasks:
    - name: Install docker
      yum:
        name: docker
        state: present

    - name: Start docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Pull FastAPI Docker image
      command: docker pull ransfordgenesis/hello-gene:latest

    - name: Run FastAPI Docker container
      command: docker run -d -p 8000:8000 ransfordgenesis/hello-gene:latest